<!DOCTYPE html>
<html lang="de" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lieferant | Admin Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white font-sans min-h-screen p-8">
  <div class="max-w-2xl mx-auto bg-zinc-900 rounded-2xl p-8 border border-white/10 shadow-2xl">
    <h1 class="text-3xl font-black mb-8 text-blue-400">🔥 Admin Panel - Lagerbestand</h1>
    
    <div id="login-section" class="mb-8">
      <label class="block text-sm font-bold mb-2">Admin Passwort:</label>
      <input type="password" id="password" class="w-full bg-black border border-white/20 rounded-lg px-4 py-3 text-white outline-none focus:border-blue-500 mb-4" placeholder="Passwort eingeben...">
    </div>

    <div id="stock-container" class="space-y-6">
      <!-- Stock items will be injected here -->
    </div>

    <button onclick="saveStock()" class="mt-8 w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-4 rounded-xl transition-colors text-lg shadow-lg shadow-blue-500/20">
      Änderungen Speichern
    </button>
    <p id="status-msg" class="text-center mt-4 font-bold hidden"></p>
  </div>

  <script>
    let currentStock = {};

    async function loadStock() {
      try {
        const res = await fetch('/api/stock');
        currentStock = await res.json();
        renderStock();
      } catch(e) {
        alert("Fehler beim Laden!");
      }
    }

    function renderStock() {
      const container = document.getElementById('stock-container');
      container.innerHTML = '';
      
      for(const [key, item] of Object.entries(currentStock)) {
        const html = `
          <div class="bg-black/50 p-6 rounded-xl border border-white/5">
            <h3 class="text-xl font-bold mb-4 text-white">${item.name}</h3>
            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="block text-xs text-zinc-400 mb-1">Stückzahl auf Lager (0 = Ausverkauft):</label>
                <input type="number" id="stock-${key}" value="${item.stock}" class="w-full bg-zinc-900 border border-white/20 rounded-lg px-3 py-2 text-white outline-none focus:border-blue-500">
              </div>
              <div>
                <label class="block text-xs text-zinc-400 mb-1">Wann wieder da? (z.B. "Morgen"):</label>
                <input type="text" id="restock-${key}" value="${item.restockDate}" class="w-full bg-zinc-900 border border-white/20 rounded-lg px-3 py-2 text-white outline-none focus:border-blue-500" placeholder="Nur wenn 0...">
              </div>
            </div>
          </div>
        `;
        container.innerHTML += html;
      }
    }

    async function saveStock() {
      const pw = document.getElementById('password').value;
      if(!pw) return alert("Bitte Passwort eingeben!");

      // Update state from inputs
      for(const key of Object.keys(currentStock)) {
        currentStock[key].stock = parseInt(document.getElementById('stock-'+key).value) || 0;
        currentStock[key].restockDate = document.getElementById('restock-'+key).value || '';
      }

      const status = document.getElementById('status-msg');
      status.className = 'text-center mt-4 font-bold text-zinc-400 block';
      status.innerText = 'Speichert...';

      try {
        const res = await fetch('/api/stock', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pw, newStock: currentStock })
        });
        
        const data = await res.json();
        if(data.success) {
          status.className = 'text-center mt-4 font-bold text-green-400 block';
          status.innerText = 'Erfolgreich gespeichert! ✅';
          setTimeout(() => status.classList.add('hidden'), 3000);
        } else {
          status.className = 'text-center mt-4 font-bold text-red-500 block';
          status.innerText = data.error || 'Falsches Passwort!';
        }
      } catch(e) {
        status.className = 'text-center mt-4 font-bold text-red-500 block';
        status.innerText = 'Netzwerkfehler!';
      }
    }

    loadStock();
  </script>
</body>
</html>
